name: Build and Test

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: 3.9.1

      - name: Build Application
        run: mvn clean install

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-artifact
          path: poseidon-server/target/*.jar