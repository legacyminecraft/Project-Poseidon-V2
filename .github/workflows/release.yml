name: Release Workflow

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Get Maven Project Version
        run: echo "PROJECT_VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)" >> $GITHUB_ENV

      - name: Create version.properties
        run: |
          {
            echo "app_name=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.name)"
            echo "version=${{ env.PROJECT_VERSION }}"
            if [[ ${{ env.PROJECT_VERSION }} == *"-SNAPSHOT"* ]]; then
              BUILD_TYPE="snapshot"
            else
              BUILD_TYPE="release"
            fi
            echo "build_type=${BUILD_TYPE}"
            echo "build_timestamp=$(date --utc +'%Y-%m-%dT%H:%M:%SZ')"
            echo "git_commit=${GITHUB_SHA}"
          } > poseidon-server/src/main/resources/version.properties

      - name: Write Maven settings.xml for Nexus auth
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>johnymuffin-nexus</id>
                <username>${env.NEXUS_USERNAME}</username>
                <password>${env.NEXUS_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - name: Build & Deploy to Nexus
        run: mvn -B -DskipTests clean deploy
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - name: Create GitHub Release
        if: ${{ !endsWith(env.PROJECT_VERSION, '-SNAPSHOT') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PROJECT_VERSION }}
          name: ${{ env.PROJECT_VERSION }}
          files: |
            poseidon-server/target/*.jar

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}