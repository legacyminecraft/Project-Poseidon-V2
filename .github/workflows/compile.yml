name: Compile

on:
  push:
  pull_request:

permissions:
  contents: read


jobs:
  compile:
    name: Maven compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compile
        run: mvn -B -DskipTests compile
